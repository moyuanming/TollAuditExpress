[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short --cov=apps/api --cov-report=term-missing --cov-fail-under=60
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    ml: marks tests that need ML model files (kept for future, currently unused — all visual inference is delegated to vehicle-ai-service)
