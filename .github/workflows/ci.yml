name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 后端 Lint ──
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check apps/api/ tests/
      - name: Format check
        run: ruff format --check apps/api/ tests/

  # ── 后端测试 ──
  api-test:
    runs-on: ubuntu-latest
    needs: api-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Run tests
        env:
          # CI 环境不需要真实 DB 连接，测试用 mock
          DB_HOST: ""
          API_KEY: test-api-key
        run: |
          pytest tests/unit/ tests/api/ -v --tb=short \
            --cov=apps/api --cov-report=term-missing --cov-fail-under=60

  # ── 前端 Lint + 测试 ──
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint src/ --no-error-on-unmatched-pattern || true
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # ── Docker 构建（仅 main 分支）──
  docker-build:
    runs-on: ubuntu-latest
    needs: [api-test, web-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: toll-audit-express:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
